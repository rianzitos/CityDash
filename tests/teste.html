<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teste Open-Meteo + Geolocation</title>
  <link rel="stylesheet" href="teste.css">
</head>

<body>

  <h1>🌤️ Teste — Open-Meteo + Geolocation</h1>
  <p class="subtitle">Busque uma cidade ou use sua localização atual</p>

  <div class="card">
    <div class="row">
      <input type="text" id="input-cidade" placeholder="Digite uma cidade (ex: Mococa)">
      <button onclick="pesquisarCidade()">Buscar</button>
    </div>
    <div id="resultados-cidade"></div>

    <button class="secondary" style="width:100%; margin-top: 6px;" onclick="usarLocalizacaoAtual()">
      📍 Usar minha localização atual
    </button>

    <div id="status"></div>
    <div id="clima"></div>
  </div>

  <script src="teste.js"></script>

</body>

</html>
