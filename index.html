<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CityDash</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="shortcut icon" href="assets/icons/favicon.svg" type="image/x-icon">
</head>

<body class="app">

    <aside class="barraLateral">


        <nav class="menu">
            <div class="containerLogo">
                <img class="logo" src="assets/img/logo.svg" alt="Logo CityDash">
                <p id="mensagemLogo">Seu painel pessoal de informações</p>
            </div>
            <ul>
                <li class="itemMenu ativo">
                    <a href="#"><i class="iconeMenu bi bi-house-door-fill"></i><span>Início</span></a>
                </li>
                <li class="itemMenu">
                    <a href="#"><i class="iconeMenu bi bi-gear-fill"></i><span>Configurações</span></a>
                </li>
            </ul>
        </nav>

        <!-- mini card fixo embaixo da sidebar, como no print -->
        <div class="miniClima">
            <span class="miniLocal"><i class="bi bi-geo-alt-fill"></i> </span>
            <div class="miniInfo">
                <i class="bi bi-cloud-sun-fill"></i>
                <span class="miniTemp"></span>
            </div>
            <span class="miniDesc"></span>
        </div>
    </aside>

    <!-- ESSA DIV É A CHAVE: envolve header + conteúdo, empurrados pra direita da sidebar -->
    <div class="areaPrincipal">

        <header class="cabecalho">
            <div class="containerPesquisa">
                <input id="input-cidade" class="barraPesquisa" type="text" placeholder="Digite uma cidade...">
                <button class="butBuscar">
                    <i class="bi bi-search"></i> Buscar
                </button>
                <button class="butLocalizacao" onclick="usarLocalizacaoAtual()">
                    <i class="bi bi-cursor-fill"></i> Usar minha localização
                </button>

                <div id="resultados-cidade" class="resultadosCidade"></div>
            </div>

            <!-- NOVO: elemento que o setStatus() precisa pra mostrar "Carregando..." / erros -->
            <div id="status"></div>

            <div class="botoes">
                <button class="butNoturno"><i class="bi bi-moon-fill"></i></button>
                <button class="butNotifica"><i class="bi bi-bell-fill"></i></button>
            </div>
        </header>

        <!-- aqui embaixo do header: 2 colunas (conteúdo principal + sidebar direita) -->
        <div class="conteudo">

            <main class="colunaPrincipal">

                <section class="banner">
                    <h1>Boa tarde, Rian!</h1>
                    <p>Aqui estão as informações da sua cidade.</p>
                </section>

                <section class="cardsInfo">
                    <div class="card cardClima">
                    </div>

                    <div class="card cardHorario">
                    </div>
                    <div class="card cardLocalizacao">...</div>
                </section>

                <section class="card anotacoes">
                    <div class="anotacoesInput">
                        <input type="text" placeholder="Digite uma anotação...">
                        <button>+ Adicionar</button>
                    </div>
                    <div class="anotacoesColunas">
                        <div class="colunaPendentes">...</div>
                        <div class="colunaConcluidas">...</div>
                    </div>
                </section>



            </main>

            <aside class="colunaDireita">
                <section class="card noticias">...</section>
                <section class="card previsao">...</section>
                <section class="card dica">...</section>
            </aside>

        </div>
    </div>

    <script src="js/script.js"></script>
</body>

</html>
